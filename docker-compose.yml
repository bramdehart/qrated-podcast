services:
  app:
    build: .
    env_file: .env
    volumes:
      - ./data:/data
      - ./feeds.yaml:/config/feeds.yaml:ro
    restart: unless-stopped

  caddy:
    image: caddy:2
    env_file: .env
    # The feed is public: no authentication. Caddy gets HTTPS for the PUBLIC_BASE_URL domain.
    command: caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/public:/srv:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
